name = "rsvp-points-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"

# ---------------------------------------------------------------------------
# Configuration the E-Board can change without touching code.
# Edit here and redeploy, or change them in the Cloudflare dashboard under
# Workers & Pages -> rsvp-points-worker -> Settings -> Variables.
# ---------------------------------------------------------------------------
[vars]
# Points needed for each standing. GOOD must be greater than OKAY.
THRESHOLD_GOOD = "12"
THRESHOLD_OKAY = "6"

# Only these email domains may sign in at all, even if the address is in the Sheet.
ALLOWED_DOMAINS = "scarletmail.rutgers.edu,rutgers.edu"

# Stricter: also require Google to report the account as managed by one of
# those domains, which rejects a personal Google account that uses a Rutgers
# address as its login. Verify every member is a Google Workspace account
# before turning this on. See README, "Enforcing the Rutgers domain".
REQUIRE_HOSTED_DOMAIN = "false"

# Which sites may call this Worker. This is an exact-match allowlist, so a
# Pages PREVIEW deployment (which gets its own <hash>.rsvp-points-portal.pages.dev
# origin) will be refused until you add it here. Production only, by design.
ALLOWED_ORIGINS = "https://rsvp-points-portal.pc937.workers.dev,http://localhost:8790"

# The Google OAuth client ID the frontend signs in with.
GOOGLE_CLIENT_ID = "32532424958-umer4n322a63nphfbnl0gkcqtrq92ms8.apps.googleusercontent.com"

# ---------------------------------------------------------------------------
# The roster can be read two ways. Prefer the first.
#
# 1. PRIVATE SHEET via the Sheets API (recommended). The Sheet stays private
#    and is shared read-only with a service account. Set three secrets:
#
#      npx wrangler secret put SHEET_ID              # from the Sheet's URL
#      npx wrangler secret put GOOGLE_SA_EMAIL       # ...iam.gserviceaccount.com
#      npx wrangler secret put GOOGLE_SA_PRIVATE_KEY # private_key from the JSON
#
#    Setting any one of them switches the Worker to this mode. Setting only
#    some is a startup error rather than a silent fall back to the public CSV.
#
#    SHEET_RANGE defaults to A:D. Set it if the roster is not on the first
#    tab or starts elsewhere, e.g. "Members!A:E".
#
# 2. PUBLISHED CSV (the original V1 approach, readable by anyone with the link)
#
# The member roster URL is deliberately NOT stored here. Anyone holding the
# published CSV link can read the entire roster, and anything committed to git
# stays recoverable from history forever. Set it as a Worker secret instead:
#
#   npx wrangler secret put SHEET_CSV_URL
#
# For local `wrangler dev`, put it in worker/.dev.vars, which is gitignored.

# How long the Worker may reuse a cached copy of the Sheet, in seconds.
SHEET_CACHE_SECONDS = "30"
