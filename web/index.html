<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSVP Points Portal</title>
  <meta name="description" content="Check your Rutgers RSVP points and membership standing.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="brand">
      <!-- RSVP's mark, in the logo's own colours. Reproduced as SVG so it
           stays crisp and needs no image request. -->
      <svg class="mark" viewBox="0 0 321 337" aria-hidden="true" focusable="false">
        <path d="M113 4 L181 199 L16 199 Z" fill="#E18282"></path>
        <path d="M108 137 L305 137 L207 330 Z" fill="#A6DCE8" opacity="0.8"></path>
      </svg>
      <span class="brand-name">RSVP</span>
    </header>

    <h1 class="title">Points &amp; Standing</h1>

    <section id="state-signin" class="block" hidden>
      <p class="lede">Sign in with your Rutgers Google account to see your current points and membership standing.</p>
      <div id="google-button" class="gbutton"></div>
      <p class="hint">Use your scarletmail.rutgers.edu or rutgers.edu account.</p>
    </section>

    <section id="state-loading" class="block" hidden>
      <p class="lede" role="status">Looking up your points…</p>
    </section>

    <section id="state-dashboard" class="block" hidden>
      <p class="identity">
        <span class="identity-greeting">Welcome, <span id="first-name"></span></span>
        <span class="identity-detail" id="member-name"></span>
        <span class="identity-email" id="signed-in-as"></span>
      </p>

      <div class="readout">
        <p class="metric">
          <span class="metric-value" id="points-value">0</span>
          <span class="metric-label">Points</span>
        </p>
        <p class="status" id="standing-pill"></p>
      </div>

      <p class="lede" id="standing-message"></p>
      <p class="hint" id="next-step" hidden></p>
    </section>

    <section id="state-error" class="block" hidden>
      <h2 class="subtitle" id="error-title">Something went wrong</h2>
      <p class="lede" id="error-message" role="alert"></p>
      <p class="actions">
        <button id="error-retry" type="button" class="button">Try again</button>
        <button id="error-signout" type="button" class="text-button">Use a different account</button>
      </p>
    </section>

    <footer class="foot" id="foot" hidden>
      <button id="signout" type="button" class="text-button">Sign out</button>
    </footer>

    <p class="colophon">Points are maintained by the RSVP E-Board.</p>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
